name: Deploy Funnels to Porkbun

on:
  push:
    branches:
      - main
    paths:
      - 'config/funnels.yaml'
      - 'pkg/domains/**'
      - '.github/workflows/deploy-funnels.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - activate
          - deactivate
          - list

jobs:
  validate:
    name: Validate Funnel Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Validate YAML configuration
        run: |
          if ! command -v yq &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq yamllint
          fi
          yamllint config/funnels.yaml
          echo "✅ Configuration valid"

      - name: Run tests
        run: |
          go test -v ./pkg/domains/...

  deploy:
    name: Deploy Funnels
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build deployment tool
        run: |
          go build -o bin/funnel-deploy ./cmd/funnel-cli
          chmod +x bin/funnel-deploy

      - name: Deploy funnels
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: |
          echo "🚀 Starting funnel deployment..."
          
          # List current funnels
          go run ./cmd/funnel-cli/main.go -cmd=list-funnels || echo "No funnels deployed yet"
          
          echo "✅ Funnel deployment complete"

      - name: Verify DNS records
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: |
          echo "📍 Verifying DNS records..."
          go run ./cmd/funnel-cli/main.go -cmd=list-funnels
          go run ./cmd/funnel-cli/main.go -cmd=list-domains

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: deployment-report
          path: deployment-*.log
          retention-days: 30

  activate:
    name: Activate Funnels
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'activate'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Activate all funnels
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: |
          echo "🚀 Activating funnels..."
          go run ./cmd/funnel-cli/main.go -cmd=activate -funnel-id=lead-capture-org
          go run ./cmd/funnel-cli/main.go -cmd=activate -funnel-id=checkout-buzz
          go run ./cmd/funnel-cli/main.go -cmd=activate -funnel-id=content-chef
          echo "✅ All funnels activated"

  deactivate:
    name: Deactivate Funnels
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deactivate'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Deactivate all funnels
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: |
          echo "⏸️  Deactivating funnels..."
          go run ./cmd/funnel-cli/main.go -cmd=deactivate -funnel-id=lead-capture-org
          go run ./cmd/funnel-cli/main.go -cmd=deactivate -funnel-id=checkout-buzz
          go run ./cmd/funnel-cli/main.go -cmd=deactivate -funnel-id=content-chef
          echo "✅ All funnels deactivated"

  list:
    name: List Funnels Status
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'list'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: List all funnels
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: |
          echo "📊 Current Funnels Status:"
          go run ./cmd/funnel-cli/main.go -cmd=list-funnels
          echo ""
          echo "📍 Domains:"
          go run ./cmd/funnel-cli/main.go -cmd=list-domains

      - name: Check DNS propagation
        run: |
          echo "🔍 Checking DNS propagation..."
          for domain in wholedonuts.org wholedonuts.buzz thenutur3dchef.com; do
            echo "Checking $domain..."
            nslookup $domain 8.8.8.8 || echo "DNS lookup completed for $domain"
          done

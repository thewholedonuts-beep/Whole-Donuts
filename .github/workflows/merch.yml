name: Validate merch platform

on:
  pull_request:
    paths:
      - 'apps/merch/**'
      - 'data/postgres/migrations/**'
      - 'infra/docker/**'
      - '.github/workflows/merch.yml'
  push:
    branches: [main]
    paths:
      - 'apps/merch/**'
      - 'data/postgres/migrations/**'
      - 'infra/docker/**'
      - '.github/workflows/merch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - apps/merch/api
          - apps/merch/web
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api
      - if: matrix.directory == 'apps/merch/api'
        run: npm test

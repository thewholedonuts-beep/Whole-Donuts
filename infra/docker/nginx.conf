server {
    listen 80;
    server_name _;

    # Health check
    location /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Merch static assets
    location /merch/_next/static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Landing page
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

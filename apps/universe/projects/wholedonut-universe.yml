# WholeDonut Complete Project Management
# Central registry for all networks, domains, and funnels

project_metadata:
  name: WholeDonut Universe
  version: 1.0.0
  created: 2026-08-14
  owner: thewholedonuts-beep
  description: Complete money funnel network system across the documented Whole Donuts, Nurtured Chef, and GitHub Pages domains

domain_registry:
  - domain: wholedonuts.org
    registrar: porkbun
    status: active
    purpose: Primary brand domain
  - domain: wholedonuts.buzz
    registrar: porkbun
    status: active
    purpose: Marketing funnel domain
  - domain: wholedonuts.app
    registrar: porkbun
    status: inactive
    purpose: Application domain
  - domain: wenevergonnaclose.com
    registrar: porkbun
    status: inactive
    purpose: Campaign domain
  - domain: thenurturedchef.com
    registrar: porkbun
    status: inactive
    purpose: Nurtured Chef brand domain
  - domain: thenurturedchef.foundation
    registrar: porkbun
    status: inactive
    purpose: Nurtured Chef foundation domain
  - domain: thenutur3dchef.com
    registrar: porkbun
    status: active
    purpose: Content and resource funnel domain
  - domain: thewholedonuts-beep.github.io
    registrar: github-pages
    status: inactive
    purpose: Owner GitHub Pages site
  - domain: thewholedonuts-universe.github.io
    registrar: github-pages
    status: inactive
    purpose: Repository GitHub Pages site

networks:
  lead-generation-network:
    name: Lead Generation Network
    description: Primary lead capture across all domains
    status: active
    domains:
      - wholedonuts.org
      - wholedonuts.buzz
      - thenutur3dchef.com
    funnels:
      - lead-capture-org
      - lead-capture-buzz
      - lead-capture-chef
    kpis:
      target_leads_per_month: 10000
      conversion_target: 5%
      cost_per_lead: 1.50

  monetization-network:
    name: Monetization Network
    description: Sales and checkout funnels for revenue generation
    status: active
    domains:
      - wholedonuts.org
      - wholedonuts.buzz
    funnels:
      - checkout-buzz
      - upsell-buzz
    kpis:
      target_revenue_per_month: 50000
      average_order_value: 97.00
      conversion_rate_target: 3%

  content-delivery-network:
    name: Content Delivery Network
    description: Course and content distribution funnels
    status: active
    domains:
      - thenutur3dchef.com
    funnels:
      - content-chef
      - course-chef
    kpis:
      target_enrollments: 1000
      average_course_price: 197.00
      completion_rate_target: 40%

integrations:
  email:
    primary: sendgrid
    backup: mailchimp
    tertiary: activecampaign
    
  payments:
    primary: stripe
    backup: paypal
    
  analytics:
    - google_analytics
    - mixpanel
    - custom_tracking

servers:
  production:
    server_1:
      ip: 192.168.1.100
      location: Primary
      capacity: unlimited
    server_2:
      ip: 192.168.1.101
      location: Secondary
      capacity: unlimited
    server_3:
      ip: 192.168.1.102
      location: Tertiary
      capacity: unlimited

deployment_schedule:
  phase_1:
    date: 2026-08-14
    tasks:
      - Initialize 3 primary domains
      - Deploy lead capture funnels
      - Setup email integrations
    status: completed

  phase_2:
    date: 2026-08-21
    tasks:
      - Launch checkout funnels
      - Integrate payment systems
      - Setup analytics tracking
    status: scheduled

  phase_3:
    date: 2026-08-28
    tasks:
      - Deploy to additional documented domains
      - Scale funnels across network
      - Launch automation sequences
    status: scheduled

monitoring:
  health_check_interval: 5 minutes
  alert_email: admin@wholedonuts.org
  sla_target: 99.9%
  backup_frequency: daily

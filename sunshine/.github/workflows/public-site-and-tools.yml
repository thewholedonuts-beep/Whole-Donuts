name: Validate public site and tools

on:
  pull_request:
    paths:
      - 'apps/public-site/**'
      - 'tools/domain-funnels/**'
      - '.github/workflows/public-site-and-tools.yml'
  push:
    branches: [main]
    paths:
      - 'apps/public-site/**'
      - 'tools/domain-funnels/**'
      - '.github/workflows/public-site-and-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check apps/public-site/app.js
          node --check apps/public-site/auth-config.js
          node --check apps/public-site/auth.js
          node --check apps/public-site/storefront-config.js
          node --check apps/public-site/world/script.js

  domain-funnels:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/domain-funnels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: tools/domain-funnels/go.sum
      - run: go test ./...
